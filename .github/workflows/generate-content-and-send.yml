name: Generate Content (News + AI101) and Send Newsletter

on:
  # Daily schedule disabled 2026-08-19.
  #
  # The Gemini free tier this pipeline was built on no longer provides enough
  # quota to generate content. The LLM steps began failing intermittently in
  # Oct 2025 and completely by Dec 2025; because those failures are caught and
  # written to the database as placeholder text rather than raised, every run
  # still reported success while producing unusable posts. The site is now an
  # archive of the 1,041 posts generated between Jun and Nov 2025.
  #
  # To re-enable: restore the `schedule` block below and confirm the models in
  # ai_content_engine have enough daily quota to complete a full run.
  #
  # schedule:
  #   # Run at 12:00 UTC daily -> ~8:00 AM ET (DST) / 7:00 AM ET (standard),
  #   # and 5:30 PM IST
  #   - cron: "0 12 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Call Generate News API
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d '{"days_ago": 2}' \
            "https://recursivai.onrender.com/posts/generate_news"

  generate-ai101:
    needs: generate-news
    runs-on: ubuntu-latest
    steps:
      - name: Wait 20 minutes before generating AI101
        run: sleep 1200  # 20 minutes

      - name: Call Generate AI101 API
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            "https://recursivai.onrender.com/posts/generate_ai101"

  send-newsletter:
    needs: generate-ai101
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait 10 minutes before sending newsletter
        run: sleep 600  # 10 minutes

      - name: Trigger newsletter send (Buttondown)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d '{"send": true}' \
            "https://recursivai.onrender.com/newsletter/buttondown"

  revalidate-frontend:
    needs: send-newsletter
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate frontend pages
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          curl -X GET "https://recursivai.vercel.app/api/revalidate?secret=$REVALIDATION_SECRET" || echo "Revalidation failed (may retry on next deployment)"